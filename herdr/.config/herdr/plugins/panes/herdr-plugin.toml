# herdr panes plugin: tmux's `prefix q` (display-panes) and a copy mode with
# relative line numbers (prefix+]). Both open a full-size popup that repaints
# the panes underneath, and that frame must be built before the popup opens
# (see the header of display-panes.pl) - so a plugin rather than a plain
# `type = "popup"` keybinding: only a plugin can open a popup from a script,
# there is no API to open one with an arbitrary command.
#
# Commands are argv arrays run without a shell, and their working directory is
# this plugin directory, so the scripts resolve without a path.
id = "dotfiles.panes"
name = "Panes"
version = "0.2.0"
min_herdr_version = "0.9.1"
description = "tmux display-panes, and a copy mode with relative line numbers"
platforms = ["macos"]

# Bound to prefix+q in config.toml.
[[actions]]
id = "display-panes"
title = "Display panes"
command = ["perl", "display-panes.pl", "show"]

# Bound to prefix+] in config.toml.
[[actions]]
id = "copy-mode"
title = "Copy mode with line numbers"
command = ["perl", "copy-mode.pl", "open"]

# Copy mode pauses when a prefix binding takes focus elsewhere; this reopens
# it when its pane gets focus back (and keeps the focus history last_pane
# needs). It runs on every focus change and exits at once when there is
# nothing paused to reopen.
[[events]]
on = "pane.focused"
command = ["perl", "copy-mode.pl", "focused"]

# The popups are opened only by the actions. 100% covers exactly the tab's
# pane area, so the repainted panes land on the cells they occupy underneath.
#
# The title becomes the popup's border title, and an empty one turns into
# "popup" (src/server/client_shell.rs). A zero-width space survives herdr's
# trim (it is not whitespace) and draws nothing.
#
# The command prints the prepared frame before perl starts, because the
# popup's first render must already contain it; cat is out in ~3 ms. stty
# goes first: a key typed before perl gets to its own raw-mode switch was
# held in the line buffer and lost, or echoed onto the frame. For copy mode
# it also stops the terminal taking ctrl+c, ctrl+v, ctrl+y, ctrl+s/q for
# itself and turning Enter into a newline.
[[panes]]
id = "picker"
title = "​"
placement = "popup"
width = "100%"
height = "100%"
command = ["/bin/sh", "-c", "stty -icanon -echo min 1 time 0; cat \"$DISPLAY_PANES_STATE/frame\"; exec perl display-panes.pl pick"]

[[panes]]
id = "copy"
title = "​"
placement = "popup"
width = "100%"
height = "100%"
command = ["/bin/sh", "-c", "stty -icanon -echo -isig -iexten -ixon -icrnl min 1 time 0; cat \"$COPY_MODE_STATE/frame\"; exec perl copy-mode.pl run"]
