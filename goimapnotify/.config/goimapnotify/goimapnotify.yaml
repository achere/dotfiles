# goimapnotify keeps an IMAP IDLE connection to INBOX and runs mail-notify
# when mail arrives (and once at start; mail-notify ignores what it has seen).
# Runs at login as a Homebrew service: brew services start goimapnotify
# Log: /opt/homebrew/var/log/goimapnotify.log
# Commands run with sh -c under launchd: PATH is only /usr/bin:/bin:..., so
# use full paths. $HOME is set.
configurations:
  - host: mail.achere.dev
    port: 993
    tls: true
    tlsOptions:
      rejectUnauthorized: true
      starttls: false
    username: contact@achere.dev
    passwordCMD: /usr/bin/security find-generic-password -s contact-achere-dev -w
    # goimapnotify merges events that arrive together (new mail plus the
    # flag change a client makes) and runs the command of only one of them.
    # So every event runs mail-notify; it shows only unread mail it has not
    # shown before, so extra runs are harmless. Set the commands per box:
    # goimapnotify 2.6 ignores onChangedMail/onDeletedMail at account level.
    boxes:
      - mailbox: INBOX
        onNewMail: $HOME/.config/goimapnotify/mail-notify mail.achere.dev contact@achere.dev contact-achere-dev
        onChangedMail: $HOME/.config/goimapnotify/mail-notify mail.achere.dev contact@achere.dev contact-achere-dev
        onDeletedMail: $HOME/.config/goimapnotify/mail-notify mail.achere.dev contact@achere.dev contact-achere-dev
        onNewMailPost: SKIP
        onChangedMailPost: SKIP
        onDeletedMailPost: SKIP
