# Mirrors ghostty/.config/ghostty/config — keep the two in sync.
# Dracula palette copied from Ghostty's bundled theme (Ghostty.app/Contents/
# Resources/ghostty/themes/Dracula) since kitty has no built-in named themes.

# theme = Dracula
background            #282a36
foreground             #f8f8f2
selection_background   #44475a
selection_foreground   #ffffff
color0  #21222c
color1  #ff5555
color2  #50fa7b
color3  #f1fa8c
color4  #bd93f9
color5  #ff79c6
color6  #8be9fd
color7  #f8f8f2
color8  #6272a4
color9  #ff6e6e
color10 #69ff94
color11 #ffffa5
color12 #d6acff
color13 #ff92df
color14 #a4ffff
color15 #ffffff

# font-family = FiraCode Nerd Font Mono; font-size = 15
font_family      FiraCode Nerd Font Mono
font_size        15.0

# cursor-color / cursor-text: overrides Dracula's default cursor colors
cursor            #D173E2
cursor_text_color #000000
cursor_shape block
cursor_blink_interval 0

# Shell integration's vi-mode cursor handling overrides the cursor settings
# above regardless of what they're set to. Keep shell integration's other
# features (title, cwd, prompt mark), just drop the cursor one.
shell_integration no-cursor

# macos-titlebar-style = hidden: no titlebar, window stays resizable.
hide_window_decorations titlebar-only

# Without this, Option is consumed as a dead-key/compose input instead of
# acting as Alt, so alt+backspace (delete word) and similar keybinds don't fire.
macos_option_as_alt yes
