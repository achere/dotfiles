# Dracula palette, except the active border: One Dark blue (#61afef) to match
# herdr's borders. Lazygit's default selection is ANSI blue, which Dracula
# maps to bright purple (#bd93f9).
gui:
  theme:
    activeBorderColor: ['#61afef', bold]
    inactiveBorderColor: ['#6272a4']
    searchingActiveBorderColor: ['#f1fa8c', bold]
    optionsTextColor: ['#8be9fd']
    selectedLineBgColor: ['#44475a']
    selectedRangeBgColor: ['#44475a']
    inactiveViewSelectedLineBgColor: ['default']
    cherryPickedCommitFgColor: ['#bd93f9']
    cherryPickedCommitBgColor: ['#44475a']
    markedBaseCommitFgColor: ['#8be9fd']
    markedBaseCommitBgColor: ['#44475a']
    unstagedChangesColor: ['#ff5555']
    defaultFgColor: ['default']

customCommands:
  - key: 'b'
    command: "git branch -vv | grep ': gone]' | awk '{print $1}' | xargs git branch -D"
    context: 'localBranches'
    description: 'Bulk-delete "upstream gone" branches'
    loadingText: 'Deleting gone branches...'
    prompts:
      - type: 'confirm'
        title: 'Confirm bulk delete'
        body: 'Are you sure you want to force-delete all "gone" branches?'
  - key: 'F'
    command: "git config --get remote.origin.fetch >/dev/null 2>&1 || git config --add remote.origin.fetch '+refs/heads/*:refs/remotes/origin/*'; git fetch origin"
    context: 'global'
    description: 'Fix worktree - ensure fetch config and fetch'
    loadingText: 'Fixing worktree and fetching...'
