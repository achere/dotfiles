# set-option -sa terminal-overrides ",xterm*:Tc"
set -g mouse on

unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

set-option -g status-position top

# keep pane numbers (prefix + q) on screen longer, in ms
set -g display-panes-time 3000

# make the active pane obvious: double-line borders + arrow markers
set -g pane-border-lines double
set -g pane-border-indicators both

# dim text in inactive panes. NOTE: must be 'terminal', not 'default' -
# 'default' means "inherit window-style" and would dim the active pane too.
# Only affects cells left at the default fg, so nvim/TUI panes are unaffected.
set -g window-style        'fg=colour245'
set -g window-active-style 'fg=terminal'

# make colors inside tmux look the same as outside of tmux
set -g default-terminal "xterm-256color"
set-option -ga terminal-overrides ",xterm-256color:RGB"

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# act like vim
setw -g mode-keys vi
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'dracula/tmux'
set -g @plugin 'tmux-plugins/tmux-sensible'
# set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @dracula-time-format "%a %d/%m %H:%M"
set -g @dracula-show-powerline true
set -g @dracula-show-flags true
set -g @dracula-show-left-icon session
set -g @dracula-plugins "cpu-usage ram-usage battery time"
set -g @dracula-military-time true
# bright purple active border instead of near-invisible #6272a4
set -g @dracula-border-contrast true
set -g @dracula-cpu-usage-label "\uf4bc"
set -g @dracula-battery-label "\uf240"
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum' 

# restore last saved session from contunuum
set -g @continuum-restore 'on'

# set vi-mode
# set-window-option -g mode-keys vi

# keybindings
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# auto-install tpm + plugins on a fresh machine. `run` is async, so on a
# genuinely first launch this can lose the race against the `tpm/tpm` line
# below (tpm isn't cloned yet when it runs) - if plugins don't appear, press
# prefix + I once.
if "test ! -d ~/.config/tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm && \
         ~/.config/tmux/plugins/tpm/bin/install_plugins'"

# Dracula's message-style omits `fill`, breaking full-line background on the
# command-prompt (e.g. rename-window). Re-add it via a hook so it re-applies
# after dracula.tmux runs, without moving the tpm line below.
set-hook -g session-created 'set -g message-style "bg=#44475a,fg=#f8f8f2,fill=#44475a"'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.config/tmux/plugins/tpm/tpm'
