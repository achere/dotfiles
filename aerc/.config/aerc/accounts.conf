# aerc account for contact@achere.dev (mox server mail.achere.dev).
# The password comes from the macOS Keychain item contact-achere-dev; this
# file holds no secret. aerc refuses to start when this file is readable by
# group or others, and git does not keep that mode: bootstrap.sh runs
# chmod 600 on it.
[achere]
source            = imaps://contact%40achere.dev@mail.achere.dev
source-cred-cmd   = security find-generic-password -s contact-achere-dev -w
outgoing          = smtps://contact%40achere.dev@mail.achere.dev
outgoing-cred-cmd = security find-generic-password -s contact-achere-dev -w
from              = Alex Chereshnev <contact@achere.dev>
default           = INBOX
copy-to           = Sent
postpone          = Drafts
archive           = Archive
cache-headers     = true
